<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Genogramy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --page-bg: #0a0e17;
            --page-text: #cbd5e1;
            --scrollbar-thumb: #a855f7;
        }

        .step-content { display: none; height: 100%; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <div id="lobby-screen" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-start p-4 transition-transform duration-500 overflow-y-auto scroller">
        <div class="w-full max-w-5xl">
            <header class="rounded-2xl bg-slate-900 border border-slate-800 text-white shadow-[0_20px_50px_-20px_rgba(0,0,0,0.6)] overflow-hidden relative">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_15%_0%,rgba(168,85,247,0.3),transparent_55%),radial-gradient(circle_at_85%_100%,rgba(217,70,239,0.25),transparent_55%)] pointer-events-none"></div>
                <div class="h-[3px] bg-gradient-to-r from-violet-500 to-fuchsia-600 relative"></div>
                <div class="p-5 md:p-8">
                    <h1 class="mt-2 text-3xl md:text-4xl font-bold leading-tight font-serif">4. Genogramy</h1>
                </div>
            </header>

            <div class="mt-4 rounded-2xl bg-slate-900 border border-slate-800 shadow-[0_1px_2px_rgba(0,0,0,0.3)] overflow-hidden">
                <div class="p-5 md:p-6">
                    <h2 class="text-xl font-bold text-slate-100 mb-4">Wybierz osobę</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="scenario-list"></div>
                </div>
            </div>
            <footer class="lesson-footer">
                <div class="footer-content">
                    <div class="social-icons">
                        <a href="https://www.youtube.com/@lieberfilip" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i></a>
                        <a href="https://www.linkedin.com/in/liebersbach-filip/" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i></a>
                        <a href="https://www.researchgate.net/profile/Filip-Liebersbach-2?ev=hdr_xprf" target="_blank" rel="noopener"><i class="fa-brands fa-researchgate"></i></a>
                    </div>
                    <div class="contact-info">
                        <a href="mailto:kontakt@lieberfilip.pl">kontakt@lieberfilip.pl</a>
                    </div>
                    <div class="copyright">© 2025–2026 Filip Liebersbach. Wszelkie prawa zastrzeżone.</div>
                </div>
            </footer>
        </div>
    </div>
    <div id="app-screen" class="flex-1 flex flex-col h-full transition-opacity duration-500 opacity-0 pointer-events-none">
        
        <div class="bg-slate-900/95 backdrop-blur border-b border-slate-800 p-3 z-20 flex justify-between items-center px-6 shrink-0 h-16">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-indigo-500/15 text-indigo-400 flex items-center justify-center text-xl border border-indigo-500/20" id="header-icon">👤</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-100 leading-tight" id="header-title">...</h1>
                    <button onclick="showLobby()" class="text-xs text-indigo-400 hover:underline font-bold uppercase">← Zmień osobę</button>
                </div>
            </div>

            <div class="flex bg-slate-800/70 p-1 rounded-lg border border-slate-700">
                <button onclick="setStep(1)" id="tab-1" class="px-5 py-2 rounded-md text-sm font-bold transition-all bg-slate-950 text-indigo-400 shadow-sm border border-slate-700/60">1. Opis</button>
                <button onclick="setStep(2)" id="tab-2" class="px-5 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-slate-700/40">2. Symbole</button>
                <button onclick="setStep(3)" id="tab-3" class="px-5 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-slate-700/40 flex items-center gap-2">3. Genogram <span id="lock-icon">🔒</span></button>
            </div>
        </div>

        <div class="flex-1 relative overflow-hidden bg-slate-950">

            <div id="step-1" class="step-content active">
                <iframe id="frame-desc" class="w-full h-full border-none"></iframe>
            </div>

            <div id="step-2" class="step-content">
                <iframe src="zajecia_4/symbole.html" class="w-full h-full border-none"></iframe>
            </div>

            <div id="step-3" class="step-content h-full relative">
                <div id="lock-overlay" class="absolute inset-0 bg-slate-950 z-10 flex flex-col items-center justify-start p-6">
                    <div class="bg-slate-900 p-8 rounded-2xl shadow-xl text-center max-w-sm border border-slate-800">
                        <div class="text-5xl mb-4">🔒</div>
                        <h3 class="text-xl font-bold text-slate-100 mb-2">Genogram Ukryty</h3>
                        <p class="text-slate-400 text-sm mb-6">Wpisz kod dostępu, aby odblokować.</p>
                        <button onclick="openPasswordModal()" class="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-700 transition">Wprowadź Hasło</button>
                    </div>
                </div>
                <div class="h-full w-full bg-slate-950">
                    <iframe id="frame-geno" class="w-full h-full border-none filter blur-md transition-all duration-700"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="password-modal" class="hidden fixed inset-0 bg-slate-950/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-8 max-w-sm w-full text-center">
            <h3 class="text-xl font-bold text-slate-100 mb-4">Podaj Hasło</h3>
            <input type="password" id="password-input" maxlength="4" class="w-full px-4 py-3 rounded-lg border border-slate-700 bg-slate-800/60 text-slate-100 mb-4 text-center text-2xl tracking-[0.5em] font-bold outline-none focus:border-indigo-500 transition-all" placeholder="****">
            <button onclick="checkPassword()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">Zatwierdź</button>
            <p id="password-error" class="text-red-400 text-sm mt-3 hidden font-bold">Błędne hasło!</p>
            <button onclick="closePasswordModal()" class="mt-4 text-slate-500 text-xs hover:text-slate-300 font-bold uppercase tracking-wider">Anuluj</button>
        </div>
    </div>

    <script>
        const scenarios = [
            { id: 1, title: "Michał (40 lat)", icon: "🏗️", fileId: "1" },
            { id: 2, title: "Karolina (29 lat)", icon: "👩‍💼", fileId: "2" },
            { id: 3, title: "Anna (34 lata)", icon: "🏠", fileId: "3" },
            { id: 4, title: "Michał (38 lat)", icon: "🎒", fileId: "4" },
            //{ id: 5, title: "Marta (Senior)", icon: "👵", fileId: "5" },
            //{ id: 6, title: "Para: Ewa i Adam", icon: "💔", fileId: "6" }
        ];

        function initLobby() {
            const list = document.getElementById('scenario-list');
            scenarios.forEach(sc => {
                const btn = document.createElement('button');
                // Usunięto warunek if (isReady), teraz wszystkie mają ten sam styl
                btn.className = `group p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500/50 hover:shadow-[0_10px_28px_-14px_rgba(0,0,0,0.6)] transition text-left flex items-center gap-4`;
                btn.onclick = () => loadScenario(sc);
                btn.innerHTML = `
                    <div class="text-2xl bg-slate-800 w-12 h-12 flex items-center justify-center rounded-lg group-hover:bg-indigo-500/15 transition">${sc.icon}</div>
                    <div>
                        <div class="font-bold text-slate-100 group-hover:text-indigo-300 transition">${sc.title}</div>
                        </div>
                `;
                list.appendChild(btn);
            });
        }

        function loadScenario(scenario) {
            document.getElementById('header-title').innerText = scenario.title;
            document.getElementById('header-icon').innerText = scenario.icon;
            document.getElementById('frame-desc').src = `zajecia_4/opis_${scenario.fileId}.html`;
            document.getElementById('frame-geno').src = `zajecia_4/geneogram_${scenario.fileId}.html`;

            document.getElementById('lobby-screen').classList.add('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.remove('opacity-0', 'pointer-events-none');
            app.classList.add('opacity-100');

            lockGenogram();
            setStep(1);
        }

        function showLobby() {
            document.getElementById('lobby-screen').classList.remove('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.add('opacity-0', 'pointer-events-none');
        }

        function setStep(stepId) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepId}`).classList.add('active');
            
            const btnDefault = "px-5 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-slate-700/40 flex items-center gap-2";
            const btnActive = "px-5 py-2 rounded-md text-sm font-bold transition-all shadow-sm bg-slate-950 text-indigo-400 border border-slate-700/60 flex items-center gap-2";
            for(let i=1; i<=3; i++) { document.getElementById(`tab-${i}`).className = (i === stepId) ? btnActive : btnDefault; }
        }

        function openPasswordModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('password-input').value = '';
            document.getElementById('password-error').classList.add('hidden');
            setTimeout(() => document.getElementById('password-input').focus(), 100);
        }
        function closePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); }
        
        function checkPassword() {
            if (document.getElementById('password-input').value === '1234') {
                const iframe = document.getElementById('frame-geno');
                const overlay = document.getElementById('lock-overlay');
                const icon = document.getElementById('lock-icon');
                iframe.classList.remove('blur-md');
                overlay.classList.add('hidden');
                icon.innerText = "🔓";
                icon.classList.add('text-green-500');
                closePasswordModal();
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        }
        
        function lockGenogram() {
            document.getElementById('frame-geno').classList.add('blur-md');
            document.getElementById('lock-overlay').classList.remove('hidden');
            document.getElementById('lock-icon').innerText = "🔒";
            document.getElementById('lock-icon').classList.remove('text-green-500');
        }

        document.getElementById('password-input').addEventListener('keyup', (e) => { if (e.key === "Enter") checkPassword(); });
        
        initLobby();
    </script>
</body>
</html>
