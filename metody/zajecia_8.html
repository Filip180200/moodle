<!DOCTYPE html>
<html lang="pl">

    <title>8. Nowoczesne Techniki Badań</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --page-bg: #f8fafc;
            --page-text: #334155;
            --scrollbar-thumb: #14b8a6;
        }
        
        /* Animacja rysowania wykresów */
        .animate-draw {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2.5s ease-out forwards;
        }
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        /* Siatka tła dla wykresów */
        .grid-bg {
            background-size: 20px 20px;
            background-image:
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
        }

        /* Interaktywne elektrody */
        .electrode { cursor: pointer; transition: fill 0.2s; }
        .electrode:hover { fill: #99f6e4; stroke: #0f766e; }
        .electrode.active { fill: #facc15; stroke: #ca8a04; stroke-width: 2px; }
    </style>
</head>

            // Wstrzyknięcie treści
            document.getElementById('content-theory').innerHTML = tech.theory;
            document.getElementById('content-method').innerHTML = tech.method;
            document.getElementById('content-result').innerHTML = tech.result;

            // Animacje przejścia ekranu
            document.getElementById('lobby-screen').classList.add('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.remove('opacity-0', 'pointer-events-none');
            app.classList.add('opacity-100');

            // Reset do kroku 1
            setStep(1);
        }

        function showLobby() {
            document.getElementById('lobby-screen').classList.remove('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.add('opacity-0', 'pointer-events-none');
        }

        function setStep(stepId) {
            // Ukrywanie wszystkich
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            
            // Pokazywanie wybranego
            document.getElementById(`step-${stepId}`).classList.add('active');
            
            // Style przycisków
            const btnDefault = "flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-white/60 hover:text-slate-700 flex items-center justify-start gap-2";
            const btnActive = "flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-md text-sm font-bold transition-all shadow-md bg-white text-teal-700 border border-slate-100 flex items-center justify-start gap-2 transform scale-105";
            
            for(let i=1; i<=3; i++) { 
                document.getElementById(`tab-${i}`).className = (i === stepId) ? btnActive : btnDefault; 
            }
        }
        
        // Inicjalizacja
        initLobby();
    </script>
</body>
</html>
