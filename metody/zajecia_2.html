<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

            <div class="mt-6 rounded-2xl bg-slate-50 border border-slate-200 shadow-lg overflow-hidden">

    </div>
    <div id="app-screen" class="flex-1 flex flex-col h-full transition-opacity duration-500 opacity-0 pointer-events-none">
        
        <!-- Header -->

            <div class="flex items-center gap-4 w-full sm:w-auto">
                <div class="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center text-2xl shadow-sm border border-emerald-100" id="header-icon">📊</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight" id="header-title">...</h1>
                    <button onclick="showLobby()" class="text-xs text-emerald-600 hover:text-emerald-800 hover:underline font-bold uppercase tracking-wide mt-1 block flex items-center gap-1">
                        ← Powrót do menu
                    </button>
                </div>
            </div>
            
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 w-full sm:w-auto justify-center">
                <button onclick="setStep(1)" id="tab-1" class="flex-1 sm:flex-none px-6 py-2 rounded-md text-sm font-bold transition-all bg-white text-emerald-700 shadow-sm">1. Teoria</button>
                <button onclick="setStep(2)" id="tab-2" class="flex-1 sm:flex-none px-6 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-white/60">2. Metodyka</button>
                <button onclick="setStep(3)" id="tab-3" class="flex-1 sm:flex-none px-6 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-white/60">3. Zadanie</button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 relative overflow-hidden bg-white flex flex-col">
            <div id="step-1" class="step-content active p-4 sm:p-8 scroller"><div class="max-w-5xl mx-auto" id="content-theory"></div></div>
            <div id="step-2" class="step-content p-4 sm:p-8 scroller"><div class="max-w-5xl mx-auto" id="content-method"></div></div>
            <div id="step-3" class="step-content p-4 sm:p-8 scroller"><div class="max-w-5xl mx-auto" id="content-result"></div></div>
        </div>
    </div>

    <script>
        const modules = [
            {
                id: 'obs',
                title: "Obserwacja",
                subtitle: "Analiza Video",
                icon: "👁️",
                color: "emerald",
                theory: `
                    <div class="mb-6 border-b pb-4 border-slate-100">
                        <h2 class="text-3xl font-serif font-bold text-slate-800">Czym jest obserwacja naukowa?</h2>
                    </div>
                    <p class="text-lg text-slate-700 mb-6">To nie jest przypadkowe patrzenie. To <strong>systematyczne spostrzeganie</strong>, mające na celu zdobycie obiektywnych danych.</p>
                    
                    <div class="grid md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-100 fade-in-up" style="animation-delay: 0.1s">
                            <div class="text-2xl mb-2">🎯</div>
                            <h3 class="font-bold text-emerald-800 mb-2">Celowość</h3>
                            <p class="text-sm text-emerald-700">Badacz wie dokładnie <strong>co i po co</strong> obserwuje. Nie jest to działanie przypadkowe.</p>
                        </div>
                        <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-100 fade-in-up" style="animation-delay: 0.2s">
                            <div class="text-2xl mb-2">📝</div>
                            <h3 class="font-bold text-emerald-800 mb-2">Planowość</h3>
                            <p class="text-sm text-emerald-700">Zaprojektowany czas, miejsce, uczestnicy i narzędzia (np. arkusze).</p>
                        </div>
                        <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-100 fade-in-up" style="animation-delay: 0.3s">
                            <div class="text-2xl mb-2">⚖️</div>
                            <h3 class="font-bold text-emerald-800 mb-2">Obiektywność</h3>
                            <p class="text-sm text-emerald-700">Opis faktów, nie wrażeń. <br><em>Źle:</em> "Był niegrzeczny". <br><em>Dobrze:</em> "Przerwał wypowiedź 3 razy".</p>
                        </div>
                    </div>
                `,
                method: `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Rodzaje Obserwacji</h2>
                    
                    <div class="space-y-8">
                        <!-- Środowisko -->
                        <div class="bg-white border-l-4 border-emerald-500 pl-6 py-2">
                            <h3 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2">🌍 1. Ze względu na środowisko</h3>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div>
                                    <strong class="text-emerald-700 block mb-2">Laboratoryjna</strong>
                                    <p class="text-sm text-slate-600 mb-2">Sztuczne warunki, wysoka kontrola zmiennych (np. lustro weneckie).</p>
                                    <div class="text-xs bg-slate-50 p-2 rounded">
                                        <span class="text-green-600 font-bold">+</span> Kontrola, precyzja<br>
                                        <span class="text-red-600 font-bold">-</span> Sztuczność, niska trafność ekologiczna
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1 italic">Przykład: Ainsworth (Obca Sytuacja)</p>
                                </div>
                                <div>
                                    <strong class="text-emerald-700 block mb-2">Naturalna</strong>
                                    <p class="text-sm text-slate-600 mb-2">Rzeczywiste otoczenie (szkoła, ulica).</p>
                                    <div class="text-xs bg-slate-50 p-2 rounded">
                                        <span class="text-green-600 font-bold">+</span> Autentyczność zachowań<br>
                                        <span class="text-red-600 font-bold">-</span> Brak kontroli nad czynnikami zakłócającymi
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1 italic">Przykład: Obserwacja dzieci na placu zabaw</p>
                                </div>
                            </div>
                        </div>

                        <!-- Rola Badacza -->
                        <div class="bg-white border-l-4 border-indigo-500 pl-6 py-2">
                            <h3 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2">🕵️ 2. Ze względu na rolę badacza</h3>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div>
                                    <strong class="text-indigo-700 block mb-2">Uczestnicząca</strong>
                                    <p class="text-sm text-slate-600 mb-2">Badacz staje się członkiem grupy.</p>
                                    <div class="text-xs bg-slate-50 p-2 rounded">
                                        <span class="text-green-600 font-bold">+</span> Głębia danych, zrozumienie "od środka"<br>
                                        <span class="text-red-600 font-bold">-</span> Subiektywizm, wpływ na grupę
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1 italic">Przykład: Rosenhan w szpitalu psychiatrycznym</p>
                                </div>
                                <div>
                                    <strong class="text-indigo-700 block mb-2">Nieuczestnicząca</strong>
                                    <p class="text-sm text-slate-600 mb-2">Badacz obserwuje z zewnątrz, jest neutralny.</p>
                                    <div class="text-xs bg-slate-50 p-2 rounded">
                                        <span class="text-green-600 font-bold">+</span> Obiektywizm<br>
                                        <span class="text-red-600 font-bold">-</span> Powierzchowność danych
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Świadomość -->
                        <div class="bg-white border-l-4 border-orange-500 pl-6 py-2">
                            <h3 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2">👁️ 3. Ze względu na wiedzę badanych</h3>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div>
                                    <strong class="text-orange-700 block mb-2">Jawna</strong>
                                    <p class="text-sm text-slate-600 mb-2">Badani wiedzą, że są obserwowani.</p>
                                    <div class="text-xs bg-slate-50 p-2 rounded">
                                        <span class="text-green-600 font-bold">+</span> Etyczność<br>
                                        <span class="text-red-600 font-bold">-</span> Efekt Hawthorne'a (zmiana zachowania)
                                    </div>
                                </div>
                                <div>
                                    <strong class="text-orange-700 block mb-2">Ukryta</strong>
                                    <p class="text-sm text-slate-600 mb-2">Badani nie wiedzą o obserwacji.</p>
                                    <div class="text-xs bg-slate-50 p-2 rounded">
                                        <span class="text-green-600 font-bold">+</span> Naturalność<br>
                                        <span class="text-red-600 font-bold">-</span> Problemy etyczne (zgoda)
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                result: `
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Obserwacja Video</h2>
                        <p class="text-slate-500">Obejrzyj nagranie i wykonaj zadanie dla wybranej grupy.</p>
                        <a href="https://www.youtube.com/watch?v=hqF1kWXUFwk" target="_blank" class="inline-flex items-center gap-2 mt-4 text-emerald-600 hover:text-emerald-800 font-bold border border-emerald-200 px-4 py-2 rounded-lg hover:bg-emerald-50 transition">
                            <span>▶️</span> Otwórz Video (YouTube)
                        </a>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-lg">
                        <div class="flex border-b border-slate-200">
                            <button onclick="toggleObsGroup(1)" id="btn-g1" class="flex-1 py-4 text-center font-bold text-slate-600 hover:bg-slate-50 border-r border-slate-100 bg-slate-100">
                                GRUPA 1<br><span class="text-xs font-normal">Opis jakościowy</span>
                            </button>
                            <button onclick="toggleObsGroup(2)" id="btn-g2" class="flex-1 py-4 text-center font-bold text-slate-600 hover:bg-slate-50">
                                GRUPA 2<br><span class="text-xs font-normal">Analiza ilościowa</span>
                            </button>
                        </div>

                        <!-- CONTENT GRUPA 1 -->
                        <div id="content-g1" class="p-8">
                            <h3 class="font-bold text-slate-800 mb-2">Instrukcja:</h3>
                            <p class="text-sm text-slate-600 mb-4 bg-yellow-50 p-3 rounded border border-yellow-200">
                                📝 Zapisz <strong>wszystko co widzisz</strong>. Skup się na ogólnym przebiegu interakcji, atmosferze i kontekście. Nie interpretuj - opisuj.
                            </p>
                            <textarea class="w-full h-48 p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm leading-relaxed" placeholder="Tutaj wpisz swoje obserwacje..."></textarea>
                        </div>

                        <!-- CONTENT GRUPA 2 -->
                        <div id="content-g2" class="p-8 hidden">
                            <h3 class="font-bold text-slate-800 mb-2">Instrukcja:</h3>
                            <p class="text-sm text-slate-600 mb-6 bg-blue-50 p-3 rounded border border-blue-200">
                                🔢 Policz wystąpienia konkretnych zachowań. Klikaj w odpowiednie przyciski za każdym razem, gdy zauważysz dane zachowanie.
                            </p>
                            
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <!-- Counter 1 -->
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                                    <div class="text-3xl mb-2">😊</div>
                                    <div class="font-bold text-slate-700 mb-2">Uśmiech</div>
                                    <div class="text-4xl font-mono text-emerald-600 font-bold mb-4" id="count-smile">0</div>
                                    <button onclick="updateCounter('count-smile', 1)" class="clicker-btn w-full bg-emerald-600 text-white font-bold py-2 rounded shadow hover:bg-emerald-700 transition">+1</button>
                                </div>
                                <!-- Counter 2 -->
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                                    <div class="text-3xl mb-2">👁️</div>
                                    <div class="font-bold text-slate-700 mb-2">Kontakt Wzrokowy</div>
                                    <div class="text-4xl font-mono text-indigo-600 font-bold mb-4" id="count-eye">0</div>
                                    <button onclick="updateCounter('count-eye', 1)" class="clicker-btn w-full bg-indigo-600 text-white font-bold py-2 rounded shadow hover:bg-indigo-700 transition">+1</button>
                                </div>
                                <!-- Counter 3 -->
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                                    <div class="text-3xl mb-2">👋</div>
                                    <div class="font-bold text-slate-700 mb-2">Gestykulacja</div>
                                    <div class="text-4xl font-mono text-orange-600 font-bold mb-4" id="count-gest">0</div>
                                    <button onclick="updateCounter('count-gest', 1)" class="clicker-btn w-full bg-orange-600 text-white font-bold py-2 rounded shadow hover:bg-orange-700 transition">+1</button>
                                </div>
                            </div>
                            <button onclick="resetCounters()" class="mt-6 text-xs text-slate-400 hover:text-red-500 underline w-full text-center">Resetuj liczniki</button>
                        </div>
                    </div>
                `
            },
            {
                id: 'exp',
                title: "Eksperyment",
                subtitle: "Projekt Badawczy",
                icon: "🧪",
                color: "indigo",
                theory: `
                    <div class="mb-6 border-b pb-4 border-slate-100">
                        <h2 class="text-3xl font-serif font-bold text-slate-800">Struktura Eksperymentu</h2>
                    </div>
                    <p class="text-lg text-slate-700 mb-6">Eksperyment różni się od obserwacji <strong>manipulacją</strong>. Badacz celowo zmienia jeden czynnik, aby sprawdzić jego wpływ na inny.</p>
                    
                    <div class="flex flex-col md:flex-row items-center justify-start gap-4 mb-8 bg-indigo-50 p-8 rounded-xl border border-indigo-100">
                        <div class="text-center bg-white p-4 rounded-lg shadow-sm w-48">
                            <strong class="block text-indigo-600 text-xl mb-1">Zmienna Niezależna (ZN)</strong>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Przyczyna</span>
                            <p class="text-xs text-slate-600 mt-2">To, czym badacz manipuluje.<br>(np. agresywny model)</p>
                        </div>
                        
                        <div class="text-3xl text-indigo-300">➜</div>
                        
                        <div class="text-center bg-white p-4 rounded-lg shadow-sm w-48">
                            <strong class="block text-indigo-600 text-xl mb-1">Zmienna Zależna (ZZ)</strong>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Skutek</span>
                            <p class="text-xs text-slate-600 mt-2">To, co badacz mierzy.<br>(np. liczba uderzeń)</p>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6 mb-8">
                        <div class="bg-white p-5 rounded-xl border-l-4 border-indigo-500 shadow-sm">
                            <h3 class="font-bold text-indigo-800 mb-2">Grupa Eksperymentalna</h3>
                            <p class="text-sm text-slate-600">Uczestnicy poddani działaniu zmiennej niezależnej (np. oglądają film z agresją).</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl border-l-4 border-slate-400 shadow-sm">
                            <h3 class="font-bold text-slate-700 mb-2">Grupa Kontrolna</h3>
                            <p class="text-sm text-slate-600">Punkt odniesienia. Nie są poddani manipulacji (np. nie oglądają nic lub oglądają film neutralny).</p>
                        </div>
                    </div>

                    <div class="bg-indigo-900 text-white p-6 rounded-xl">
                        <h3 class="font-bold mb-4 flex items-center gap-2">🛡️ Eliminacja błędów (Ślepe próby)</h3>
                        <div class="space-y-3 text-sm">
                            <p><strong class="text-indigo-300">I stopnia:</strong> Uczestnik nie wie, w której jest grupie (minimalizuje efekt oczekiwań).</p>
                            <p><strong class="text-indigo-300">II stopnia (Double-blind):</strong> Ani uczestnik, ani badacz nie wiedzą, kto jest w której grupie (kluczowe np. w badaniach leków).</p>
                        </div>
                    </div>
                `,
                method: `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Rodzaje Eksperymentów</h2>
                    <p class="text-slate-600 mb-6">Wybór rodzaju eksperymentu zależy od celu badania i możliwości kontroli zmiennych.</p>

                    <div class="space-y-6">
                        <!-- Laboratoryjny -->
                        <div class="bg-white border-l-4 border-indigo-500 shadow-sm rounded-r-xl p-6">
                            <h3 class="font-bold text-indigo-800 text-lg mb-2">1. Eksperyment Laboratoryjny</h3>
                            <p class="text-sm text-slate-700 mb-3">Badanie w warunkach sztucznych, gdzie badacz ma pełną kontrolę nad otoczeniem.</p>
                            <div class="grid grid-cols-2 gap-4 text-xs mb-3">
                                <div class="bg-green-50 p-2 rounded text-green-800 border border-green-200">
                                    <strong>+ Zalety:</strong> Wysoka kontrola zmiennych, łatwa replikacja.
                                </div>
                                <div class="bg-red-50 p-2 rounded text-red-800 border border-red-200">
                                    <strong>- Wady:</strong> Sztuczność sytuacji, niska trafność ekologiczna.
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 italic border-t border-slate-100 pt-2">Przykład: Milgram (posłuszeństwo), Bandura (Lalka Bobo).</p>
                        </div>

                        <!-- Naturalny (Terenowy) -->
                        <div class="bg-white border-l-4 border-emerald-500 shadow-sm rounded-r-xl p-6">
                            <h3 class="font-bold text-emerald-800 text-lg mb-2">2. Eksperyment Naturalny (Terenowy)</h3>
                            <p class="text-sm text-slate-700 mb-3">Badanie w rzeczywistym środowisku uczestnika (szkoła, ulica), bez ingerencji w strukturę otoczenia.</p>
                            <div class="grid grid-cols-2 gap-4 text-xs mb-3">
                                <div class="bg-green-50 p-2 rounded text-green-800 border border-green-200">
                                    <strong>+ Zalety:</strong> Naturalne zachowania, wysoka trafność ekologiczna.
                                </div>
                                <div class="bg-red-50 p-2 rounded text-red-800 border border-red-200">
                                    <strong>- Wady:</strong> Mała kontrola nad zmiennymi zakłócającymi.
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 italic border-t border-slate-100 pt-2">Przykład: Piliavin (pomoc w metrze).</p>
                        </div>

                        <!-- Eksperyment Polowy -->
                        <div class="bg-white border-l-4 border-teal-500 shadow-sm rounded-r-xl p-6">
                            <h3 class="font-bold text-teal-800 text-lg mb-2">3. Eksperyment Polowy</h3>
                            <p class="text-sm text-slate-700 mb-3">Odbywa się w terenie, ale badacz wprowadza manipulację (np. podstawiona osoba).</p>
                            <div class="grid grid-cols-2 gap-4 text-xs mb-3">
                                <div class="bg-green-50 p-2 rounded text-green-800 border border-green-200">
                                    <strong>+ Zalety:</strong> Połączenie realizmu z kontrolą Zmienną Niezależną.
                                </div>
                                <div class="bg-red-50 p-2 rounded text-red-800 border border-red-200">
                                    <strong>- Wady:</strong> Ryzyko nieprzewidzianych zakłóceń z otoczenia.
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 italic border-t border-slate-100 pt-2">Przykład: Badanie wpływu humoru na hojność w barze.</p>
                        </div>

                        <!-- Quasi-eksperyment -->

        function loadModule(mod) {

            document.getElementById('header-title').innerHTML = `<span class="block text-xs text-slate-400 uppercase tracking-wider">${mod.subtitle}</span>${mod.title}`;

            document.getElementById('content-result').innerHTML = mod.result;

            document.getElementById('lobby-screen').classList.add('-translate-y-full');

        function setStep(stepId) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepId}`).classList.add('active');
            
            const btnDefault = "flex-1 sm:flex-none px-6 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-slate-50";
