    <script>
        const modules = [
            {
                id: 'obs',
                title: "Obserwacja",
                subtitle: "Analiza Video",
                icon: "👁️",
                color: "emerald",
                theory: `
                    <div class="mb-6 border-b pb-4 border-slate-800">
                        <h2 class="text-3xl font-serif font-bold text-slate-100">Czym jest obserwacja naukowa?</h2>
                    </div>
                    <p class="text-lg text-slate-400 mb-6">To nie jest przypadkowe patrzenie. To <strong class="text-slate-200">systematyczne spostrzeganie</strong>, mające na celu zdobycie obiektywnych danych.</p>

                    <div class="grid md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 card-hover transition-all duration-200 fade-in-up" style="animation-delay: 0.1s">
                            <div class="w-11 h-11 flex items-center justify-center rounded-xl bg-emerald-500/15 text-xl mb-3">🎯</div>
                            <h3 class="font-bold text-emerald-300 mb-2">Celowość</h3>
                            <p class="text-sm text-slate-400">Badacz wie dokładnie <strong class="text-slate-300">co i po co</strong> obserwuje. Nie jest to działanie przypadkowe.</p>
                        </div>
                        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 card-hover transition-all duration-200 fade-in-up" style="animation-delay: 0.2s">
                            <div class="w-11 h-11 flex items-center justify-center rounded-xl bg-emerald-500/15 text-xl mb-3">📝</div>
                            <h3 class="font-bold text-emerald-300 mb-2">Planowość</h3>
                            <p class="text-sm text-slate-400">Zaprojektowany czas, miejsce, uczestnicy i narzędzia (np. arkusze).</p>
                        </div>
                        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 card-hover transition-all duration-200 fade-in-up" style="animation-delay: 0.3s">
                            <div class="w-11 h-11 flex items-center justify-center rounded-xl bg-emerald-500/15 text-xl mb-3">⚖️</div>
                            <h3 class="font-bold text-emerald-300 mb-2">Obiektywność</h3>
                            <p class="text-sm text-slate-400">Opis faktów, nie wrażeń. <br><em>Źle:</em> "Był niegrzeczny". <br><em>Dobrze:</em> "Przerwał wypowiedź 3 razy".</p>
                        </div>
                    </div>
                `,
                method: `
                    <h2 class="text-2xl font-bold text-slate-100 mb-6">Rodzaje Obserwacji</h2>

                    <div class="space-y-6">
                        <!-- Środowisko -->
                        <div class="bg-slate-900 border border-slate-800 border-l-4 border-l-emerald-500 rounded-r-xl p-6">
                            <h3 class="font-bold text-slate-200 text-lg mb-4 flex items-center gap-2">🌍 1. Ze względu na środowisko</h3>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div>
                                    <strong class="text-emerald-300 block mb-2">Laboratoryjna</strong>
                                    <p class="text-sm text-slate-400 mb-2">Sztuczne warunki, wysoka kontrola zmiennych (np. lustro weneckie).</p>
                                    <div class="text-xs bg-slate-800/50 p-2 rounded-lg">
                                        <span class="text-emerald-400 font-bold">+</span> Kontrola, precyzja<br>
                                        <span class="text-rose-400 font-bold">-</span> Sztuczność, niska trafność ekologiczna
                                    </div>
                                    <p class="text-xs text-slate-500 mt-1 italic">Przykład: Ainsworth (Obca Sytuacja)</p>
                                </div>
                                <div>
                                    <strong class="text-emerald-300 block mb-2">Naturalna</strong>
                                    <p class="text-sm text-slate-400 mb-2">Rzeczywiste otoczenie (szkoła, ulica).</p>
                                    <div class="text-xs bg-slate-800/50 p-2 rounded-lg">
                                        <span class="text-emerald-400 font-bold">+</span> Autentyczność zachowań<br>
                                        <span class="text-rose-400 font-bold">-</span> Brak kontroli nad czynnikami zakłócającymi
                                    </div>
                                    <p class="text-xs text-slate-500 mt-1 italic">Przykład: Obserwacja dzieci na placu zabaw</p>
                                </div>
                            </div>
                        </div>

                        <!-- Rola Badacza -->
                        <div class="bg-slate-900 border border-slate-800 border-l-4 border-l-indigo-500 rounded-r-xl p-6">
                            <h3 class="font-bold text-slate-200 text-lg mb-4 flex items-center gap-2">🕵️ 2. Ze względu na rolę badacza</h3>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div>
                                    <strong class="text-indigo-300 block mb-2">Uczestnicząca</strong>
                                    <p class="text-sm text-slate-400 mb-2">Badacz staje się członkiem grupy.</p>
                                    <div class="text-xs bg-slate-800/50 p-2 rounded-lg">
                                        <span class="text-emerald-400 font-bold">+</span> Głębia danych, zrozumienie "od środka"<br>
                                        <span class="text-rose-400 font-bold">-</span> Subiektywizm, wpływ na grupę
                                    </div>
                                    <p class="text-xs text-slate-500 mt-1 italic">Przykład: Rosenhan w szpitalu psychiatrycznym</p>
                                </div>
                                <div>
                                    <strong class="text-indigo-300 block mb-2">Nieuczestnicząca</strong>
                                    <p class="text-sm text-slate-400 mb-2">Badacz obserwuje z zewnątrz, jest neutralny.</p>
                                    <div class="text-xs bg-slate-800/50 p-2 rounded-lg">
                                        <span class="text-emerald-400 font-bold">+</span> Obiektywizm<br>
                                        <span class="text-rose-400 font-bold">-</span> Powierzchowność danych
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Świadomość -->
                        <div class="bg-slate-900 border border-slate-800 border-l-4 border-l-orange-500 rounded-r-xl p-6">
                            <h3 class="font-bold text-slate-200 text-lg mb-4 flex items-center gap-2">👁️ 3. Ze względu na wiedzę badanych</h3>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div>
                                    <strong class="text-orange-300 block mb-2">Jawna</strong>
                                    <p class="text-sm text-slate-400 mb-2">Badani wiedzą, że są obserwowani.</p>
                                    <div class="text-xs bg-slate-800/50 p-2 rounded-lg">
                                        <span class="text-emerald-400 font-bold">+</span> Etyczność<br>
                                        <span class="text-rose-400 font-bold">-</span> Efekt Hawthorne'a (zmiana zachowania)
                                    </div>
                                </div>
                                <div>
                                    <strong class="text-orange-300 block mb-2">Ukryta</strong>
                                    <p class="text-sm text-slate-400 mb-2">Badani nie wiedzą o obserwacji.</p>
                                    <div class="text-xs bg-slate-800/50 p-2 rounded-lg">
                                        <span class="text-emerald-400 font-bold">+</span> Naturalność<br>
                                        <span class="text-rose-400 font-bold">-</span> Problemy etyczne (zgoda)
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                result: `
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-slate-100 mb-2">Obserwacja Video</h2>
                        <p class="text-slate-500">Obejrzyj nagranie i wykonaj zadanie dla wybranej grupy.</p>
                        <a href="https://www.youtube.com/watch?v=hqF1kWXUFwk" target="_blank" class="inline-flex items-center gap-2 mt-4 text-emerald-400 hover:text-emerald-300 font-bold border border-emerald-500/30 px-4 py-2 rounded-lg hover:bg-emerald-500/10 transition">
                            <span>▶️</span> Otwórz Video (YouTube)
                        </a>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                        <div class="flex border-b border-slate-800">
                            <button onclick="toggleObsGroup(1)" id="btn-g1" class="flex-1 py-4 text-center font-bold text-slate-300 hover:bg-slate-800/60 border-r border-slate-800 bg-slate-800">
                                GRUPA 1<br><span class="text-xs font-normal text-slate-500">Opis jakościowy</span>
                            </button>
                            <button onclick="toggleObsGroup(2)" id="btn-g2" class="flex-1 py-4 text-center font-bold text-slate-300 hover:bg-slate-800/60">
                                GRUPA 2<br><span class="text-xs font-normal text-slate-500">Analiza ilościowa</span>
                            </button>
                        </div>

                        <!-- CONTENT GRUPA 1 -->
                        <div id="content-g1" class="p-8">
                            <h3 class="font-bold text-slate-200 mb-2">Instrukcja:</h3>
                            <p class="text-sm text-slate-300 mb-4 bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">
                                📝 Zapisz <strong>wszystko co widzisz</strong>. Skup się na ogólnym przebiegu interakcji, atmosferze i kontekście. Nie interpretuj - opisuj.
                            </p>
                            <textarea class="w-full h-48 p-4 bg-slate-800/60 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm text-slate-200 placeholder-slate-500 leading-relaxed" placeholder="Tutaj wpisz swoje obserwacje..."></textarea>
                        </div>

                        <!-- CONTENT GRUPA 2 -->
                        <div id="content-g2" class="p-8 hidden">
                            <h3 class="font-bold text-slate-200 mb-2">Instrukcja:</h3>
                            <p class="text-sm text-slate-300 mb-6 bg-blue-500/10 p-3 rounded-lg border border-blue-500/20">
                                🔢 Policz wystąpienia konkretnych zachowań. Klikaj w odpowiednie przyciski za każdym razem, gdy zauważysz dane zachowanie.
                            </p>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <!-- Counter 1 -->
                                <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700 text-center">
                                    <div class="text-3xl mb-2">😊</div>
                                    <div class="font-bold text-slate-300 mb-2">Uśmiech</div>
                                    <div class="text-4xl font-mono text-emerald-400 font-bold mb-4" id="count-smile">0</div>
                                    <button onclick="updateCounter('count-smile', 1)" class="clicker-btn w-full bg-emerald-600 text-white font-bold py-2 rounded shadow hover:bg-emerald-700 transition">+1</button>
                                </div>
                                <!-- Counter 2 -->
                                <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700 text-center">
                                    <div class="text-3xl mb-2">👁️</div>
                                    <div class="font-bold text-slate-300 mb-2">Kontakt Wzrokowy</div>
                                    <div class="text-4xl font-mono text-indigo-400 font-bold mb-4" id="count-eye">0</div>
                                    <button onclick="updateCounter('count-eye', 1)" class="clicker-btn w-full bg-indigo-600 text-white font-bold py-2 rounded shadow hover:bg-indigo-700 transition">+1</button>
                                </div>
                                <!-- Counter 3 -->
                                <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700 text-center">
                                    <div class="text-3xl mb-2">👋</div>
                                    <div class="font-bold text-slate-300 mb-2">Gestykulacja</div>
                                    <div class="text-4xl font-mono text-orange-400 font-bold mb-4" id="count-gest">0</div>
                                    <button onclick="updateCounter('count-gest', 1)" class="clicker-btn w-full bg-orange-600 text-white font-bold py-2 rounded shadow hover:bg-orange-700 transition">+1</button>
                                </div>
                            </div>
                            <button onclick="resetCounters()" class="mt-6 text-xs text-slate-500 hover:text-rose-400 underline w-full text-center">Resetuj liczniki</button>
                        </div>
                    </div>
                `
            },
            {
                id: 'exp',
                title: "Eksperyment",
                subtitle: "Projekt Badawczy",
                icon: "🧪",
                color: "indigo",
                theory: `
                    <div class="mb-6 border-b pb-4 border-slate-800">
                        <h2 class="text-3xl font-serif font-bold text-slate-100">Struktura Eksperymentu</h2>
                    </div>
                    <p class="text-lg text-slate-400 mb-6">Eksperyment różni się od obserwacji <strong class="text-slate-200">manipulacją</strong>. Badacz celowo zmienia jeden czynnik, aby sprawdzić jego wpływ na inny.</p>

                    <div class="flex flex-col md:flex-row items-center justify-start gap-4 mb-8 bg-indigo-500/10 p-8 rounded-xl border border-indigo-500/20">
                        <div class="text-center bg-slate-900 border border-slate-800 p-4 rounded-lg w-48">
                            <strong class="block text-indigo-300 text-xl mb-1">Zmienna Niezależna (ZN)</strong>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Przyczyna</span>
                            <p class="text-xs text-slate-400 mt-2">To, czym badacz manipuluje.<br>(np. agresywny model)</p>
                        </div>

                        <div class="text-3xl text-indigo-500">➜</div>

                        <div class="text-center bg-slate-900 border border-slate-800 p-4 rounded-lg w-48">
                            <strong class="block text-indigo-300 text-xl mb-1">Zmienna Zależna (ZZ)</strong>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Skutek</span>
                            <p class="text-xs text-slate-400 mt-2">To, co badacz mierzy.<br>(np. liczba uderzeń)</p>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 mb-8">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl border-l-4 border-l-indigo-500">
                            <h3 class="font-bold text-indigo-300 mb-2">Grupa Eksperymentalna</h3>
                            <p class="text-sm text-slate-400">Uczestnicy poddani działaniu zmiennej niezależnej (np. oglądają film z agresją).</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl border-l-4 border-l-slate-500">
                            <h3 class="font-bold text-slate-300 mb-2">Grupa Kontrolna</h3>
                            <p class="text-sm text-slate-400">Punkt odniesienia. Nie są poddani manipulacji (np. nie oglądają nic lub oglądają film neutralny).</p>
                        </div>
                    </div>

                    <div class="bg-indigo-500/10 border border-indigo-500/20 text-slate-200 p-6 rounded-xl">
                        <h3 class="font-bold mb-4 flex items-center gap-2 text-slate-100">🛡️ Eliminacja błędów (Ślepe próby)</h3>
                        <div class="space-y-3 text-sm">
                            <p><strong class="text-indigo-300">I stopnia:</strong> Uczestnik nie wie, w której jest grupie (minimalizuje efekt oczekiwań).</p>
                            <p><strong class="text-indigo-300">II stopnia (Double-blind):</strong> Ani uczestnik, ani badacz nie wiedzą, kto jest w której grupie (kluczowe np. w badaniach leków).</p>
                        </div>
                    </div>
                `,
                method: `
                    <h2 class="text-2xl font-bold text-slate-100 mb-6">Rodzaje Eksperymentów</h2>
                    <p class="text-slate-400 mb-6">Wybór rodzaju eksperymentu zależy od celu badania i możliwości kontroli zmiennych.</p>

                    <div class="space-y-4">
                        <!-- Laboratoryjny -->
                        <div class="bg-slate-900 border border-slate-800 border-l-4 border-l-indigo-500 rounded-r-xl p-6">
                            <h3 class="font-bold text-indigo-300 text-lg mb-2">1. Eksperyment Laboratoryjny</h3>
                            <p class="text-sm text-slate-400 mb-3">Badanie w warunkach sztucznych, gdzie badacz ma pełną kontrolę nad otoczeniem.</p>
                            <div class="grid grid-cols-2 gap-4 text-xs mb-3">
                                <div class="bg-emerald-500/10 p-2 rounded-lg text-emerald-300 border border-emerald-500/20">
                                    <strong>+ Zalety:</strong> Wysoka kontrola zmiennych, łatwa replikacja.
                                </div>
                                <div class="bg-rose-500/10 p-2 rounded-lg text-rose-300 border border-rose-500/20">
                                    <strong>- Wady:</strong> Sztuczność sytuacji, niska trafność ekologiczna.
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 italic border-t border-slate-800 pt-2">Przykład: Milgram (posłuszeństwo), Bandura (Lalka Bobo).</p>
                        </div>

                        <!-- Naturalny (Terenowy) -->
                        <div class="bg-slate-900 border border-slate-800 border-l-4 border-l-emerald-500 rounded-r-xl p-6">
                            <h3 class="font-bold text-emerald-300 text-lg mb-2">2. Eksperyment Naturalny (Terenowy)</h3>
                            <p class="text-sm text-slate-400 mb-3">Badanie w rzeczywistym środowisku uczestnika (szkoła, ulica), bez ingerencji w strukturę otoczenia.</p>
                            <div class="grid grid-cols-2 gap-4 text-xs mb-3">
                                <div class="bg-emerald-500/10 p-2 rounded-lg text-emerald-300 border border-emerald-500/20">
                                    <strong>+ Zalety:</strong> Naturalne zachowania, wysoka trafność ekologiczna.
                                </div>
                                <div class="bg-rose-500/10 p-2 rounded-lg text-rose-300 border border-rose-500/20">
                                    <strong>- Wady:</strong> Mała kontrola nad zmiennymi zakłócającymi.

            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
