<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Metody Projekcyjne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --page-bg: #f0fdfa;
            --page-text: #334155;
            --scrollbar-thumb: #0ea5e9;
        }
        
        /* Animacja rysowania */
        .animate-draw {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s ease-out forwards;
        }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }

        /* Efekt deszczu dla DAPR */
        .rain-drop {
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100px); }
        }

        /* Polaroid Effect */
        .polaroid {
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
            transition: transform 0.3s;
        }
        .polaroid:hover { transform: rotate(0deg) scale(1.02); z-index: 10; }
    </style>
</head>

            document.getElementById('header-icon').innerText = tech.icon;

            document.getElementById('content-method').innerHTML = tech.method;
            document.getElementById('content-result').innerHTML = tech.result;

            document.getElementById('lobby-screen').classList.add('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.remove('opacity-0', 'pointer-events-none');
            app.classList.add('opacity-100');

            setStep(1);

            if (history.replaceState) {
                history.replaceState(null, '', `${location.pathname}#tech=${tech.id}`);
            }
        }

        function showLobby() {
            document.getElementById('lobby-screen').classList.remove('-translate-y-full');

            if (history.replaceState) {

            }
        }

        function setStep(stepId) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepId}`).classList.add('active');
            
            const btnDefault = "flex-1 sm:flex-none px-6 py-2 rounded-md text-sm font-bold transition-all text-slate-500 hover:bg-slate-50";
            const btnActive = `flex-1 sm:flex-none px-6 py-2 rounded-md text-sm font-bold transition-all shadow-md bg-white text-${currentTech ? currentTech.color : 'indigo'}-600 border border-slate-100 transform scale-105`;
            
            for(let i=1; i<=3; i++) { 
                const btn = document.getElementById(`tab-${i}`);
                btn.className = (i === stepId) ? btnActive : btnDefault;
            }
        }
        
        function openFromHash() {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const techId = params.get('tech');
            if (!techId) return;
            const tech = techniques.find(item => item.id === techId);
            if (tech) {

            }
        }

        initLobby();
        openFromHash();
