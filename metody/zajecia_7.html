<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. Kreatywne techniki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --page-bg: #0a0e17;
            --page-text: #cbd5e1;
            --scrollbar-thumb: #d946ef;
        }

        /* Polaroid Effect */
        .polaroid {
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.5);
            transform: rotate(-2deg);
            transition: transform 0.3s;
        }
        .polaroid:hover { transform: rotate(0deg) scale(1.02); z-index: 10; }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <!-- EKRAN LOBBY -->
    <div id="lobby-screen" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-start p-4 transition-transform duration-500 overflow-y-auto scroller">
        <div class="w-full max-w-5xl">
            <header class="rounded-[28px] bg-slate-900 border border-slate-800 shadow-[0_20px_50px_-20px_rgba(0,0,0,0.6)] overflow-hidden relative">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_15%_0%,rgba(168,85,247,0.35),transparent_55%),radial-gradient(circle_at_85%_100%,rgba(236,72,153,0.25),transparent_55%)] pointer-events-none"></div>
                <div class="h-[3px] bg-gradient-to-r from-purple-500 via-fuchsia-500 to-pink-500 relative"></div>
                <div class="p-6 md:p-10 relative">
                    <h1 class="mt-2 text-3xl md:text-4xl font-bold leading-tight tracking-tight text-white font-serif">7. Kreatywne techniki</h1>
                </div>
            </header>

            <div class="mt-4 rounded-[28px] bg-slate-900 border border-slate-800 shadow-[0_1px_2px_rgba(0,0,0,0.3)] overflow-hidden">
                <div class="p-6 md:p-8">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-5">Wybierz technikę</h2>
                    <div class="grid grid-cols-1 gap-3" id="tech-list"></div>
                </div>
            </div>
            <footer class="lesson-footer">
                <div class="footer-content">
                    <div class="social-icons">
                        <a href="https://www.youtube.com/@lieberfilip" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i></a>
                        <a href="https://www.linkedin.com/in/liebersbach-filip/" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i></a>
                        <a href="https://www.researchgate.net/profile/Filip-Liebersbach-2?ev=hdr_xprf" target="_blank" rel="noopener"><i class="fa-brands fa-researchgate"></i></a>
                    </div>
                    <div class="contact-info">
                        <a href="mailto:kontakt@lieberfilip.pl">kontakt@lieberfilip.pl</a>
                    </div>
                    <div class="copyright">© 2025–2026 Filip Liebersbach. Wszelkie prawa zastrzeżone.</div>
                </div>
            </footer>
        </div>
    </div>
    <div id="app-screen" class="flex-1 flex flex-col h-full transition-opacity duration-500 opacity-0 pointer-events-none">

        <!-- Header -->
        <div class="bg-slate-900/95 backdrop-blur border-b border-slate-800 p-4 z-20 flex flex-col sm:flex-row justify-between items-center px-6 shrink-0 h-auto sm:h-20 gap-4">
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <div class="w-12 h-12 rounded-lg bg-purple-500/15 text-purple-400 flex items-center justify-center text-2xl border border-purple-500/20" id="header-icon">📸</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-100 leading-tight" id="header-title">...</h1>
                    <button onclick="showLobby()" class="text-xs text-slate-500 hover:text-purple-400 font-semibold uppercase tracking-wide mt-1 inline-flex items-center gap-1 transition-colors">
                        ← Powrót do menu
                    </button>
                </div>
            </div>

            <div class="flex bg-slate-800/70 p-1 rounded-xl border border-slate-700 w-full sm:w-auto justify-center">
                <button onclick="setStep(1)" id="tab-1" class="flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-semibold transition-all bg-slate-950 text-purple-400 shadow-sm border border-slate-700/60">1. Zasady</button>
                <button onclick="setStep(2)" id="tab-2" class="flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-semibold transition-all text-slate-500 hover:bg-slate-700/40">2. Procedura</button>
                <button onclick="setStep(3)" id="tab-3" class="flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-semibold transition-all text-slate-500 hover:bg-slate-700/40">3. Zadanie</button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 relative overflow-hidden bg-slate-950 flex flex-col">
            <div id="step-1" class="step-content active p-5 sm:p-10 scroller"><div class="max-w-5xl mx-auto" id="content-theory"></div></div>
            <div id="step-2" class="step-content p-5 sm:p-10 scroller"><div class="max-w-5xl mx-auto" id="content-method"></div></div>
            <div id="step-3" class="step-content p-5 sm:p-10 scroller"><div class="max-w-5xl mx-auto" id="content-result"></div></div>
        </div>
    </div>

    <script>
        const techniques = [
            {
                id: 'photovoice',
                title: "PhotoVoice",
                subtitle: "Technika Skojarzeń Wizualnych",
                icon: "📸",
                color: "purple",
                theory: `
                    <div class="mb-6 border-b pb-4 border-slate-800">
                        <h2 class="text-3xl font-serif font-bold text-slate-100">Co to jest PhotoVoice?</h2>
                    </div>
                    <p class="text-lg text-slate-400 mb-6">Metoda badawcza dająca uczestnikom możliwość identyfikowania, reprezentowania i wzmacniania swojej społeczności poprzez technikę fotograficzną.</p>

                    <div class="grid md:grid-cols-2 gap-8 items-center">
                        <div class="bg-purple-500/10 p-6 rounded-2xl border border-purple-500/30">
                            <h3 class="font-bold text-purple-300 mb-4 text-xl">Kluczowe pytania:</h3>
                            <ul class="space-y-4">
                                <li class="flex items-center gap-3 bg-slate-900 border border-slate-800 p-3 rounded-xl">
                                    <span class="text-2xl">👀</span>
                                    <span class="font-bold text-slate-200">Co widzisz?</span>
                                </li>
                                <li class="flex items-center gap-3 bg-slate-900 border border-slate-800 p-3 rounded-xl">
                                    <span class="text-2xl">🛑</span>
                                    <span class="font-bold text-slate-200">Co Ci przeszkadza?</span>
                                </li>
                                <li class="flex items-center gap-3 bg-slate-900 border border-slate-800 p-3 rounded-xl">
                                    <span class="text-2xl">💚</span>
                                    <span class="font-bold text-slate-200">Co Ci pomaga?</span>
                                </li>
                            </ul>
                        </div>

                        <div class="relative h-64 flex justify-center items-center">
                            <!-- Visual representation -->
                            <div class="polaroid absolute top-0 left-10 w-40 h-48 bg-white z-10">
                                <div class="bg-slate-200 w-full h-32 mb-2 flex items-center justify-center text-3xl">🚫</div>
                                <div class="text-center font-handwriting text-xs text-slate-500">To przeszkadza</div>
                            </div>
                            <div class="polaroid absolute top-4 right-10 w-40 h-48 bg-white z-20" style="transform: rotate(3deg);">
                                <div class="bg-slate-200 w-full h-32 mb-2 flex items-center justify-center text-3xl">✅</div>
                                <div class="text-center font-handwriting text-xs text-slate-500">To pomaga</div>
                            </div>
                        </div>
                    </div>
                `,
                method: `
                    <h2 class="text-2xl font-bold text-slate-100 mb-6">Procedura Analizy SHOWED</h2>
                    <p class="text-slate-400 mb-6">Analiza zdjęć odbywa się według ustrukturyzowanego schematu akronimu SHOWED. Pozwala to przejść od prostego opisu do planu działania.</p>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 border-l-4 border-l-purple-500 hover:bg-purple-500/10 transition-colors">
                            <div class="text-4xl font-black text-purple-500/25 mb-2">S</div>
                            <strong class="block text-slate-200">See</strong>
                            <p class="text-sm text-slate-400">Co tu widzisz? (Opis dosłowny zdjęcia).</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 border-l-4 border-l-purple-500 hover:bg-purple-500/10 transition-colors">
                            <div class="text-4xl font-black text-purple-500/25 mb-2">H</div>
                            <strong class="block text-slate-200">Happening</strong>
                            <p class="text-sm text-slate-400">Co się tutaj dzieje? (Jaka jest historia za zdjęciem?).</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 border-l-4 border-l-purple-500 hover:bg-purple-500/10 transition-colors">
                            <div class="text-4xl font-black text-purple-500/25 mb-2">O</div>
                            <strong class="block text-slate-200">Our</strong>
                            <p class="text-sm text-slate-400">Jak to odnosi się do naszego życia / naszej społeczności?</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 border-l-4 border-l-purple-500 hover:bg-purple-500/10 transition-colors">
                            <div class="text-4xl font-black text-purple-500/25 mb-2">W</div>
                            <strong class="block text-slate-200">Why</strong>
                            <p class="text-sm text-slate-400">Dlaczego ten problem/sytuacja istnieje? (Szukanie przyczyn).</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 border-l-4 border-l-purple-500 hover:bg-purple-500/10 transition-colors">
                            <div class="text-4xl font-black text-purple-500/25 mb-2">E</div>
                            <strong class="block text-slate-200">Empowerment / Education</strong>
                            <p class="text-sm text-slate-400">Co możemy z tym zrobić? Jak to zmienić?</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 border-l-4 border-l-purple-500 hover:bg-purple-500/10 transition-colors">
                            <div class="text-4xl font-black text-purple-500/25 mb-2">D</div>
                            <strong class="block text-slate-200">Do</strong>
                            <p class="text-sm text-slate-400">Co konkretnie zrobimy? (Działanie).</p>
                        </div>
                    </div>
                `,
                result: `
                    <div class="max-w-3xl mx-auto">
                        <h2 class="text-2xl font-bold text-slate-100 mb-2">Zadanie: Opis zdjęcia</h2>
                        <p class="text-slate-500 mb-6">Wyobraź sobie, że to zdjęcie przedstawia problem w Twoim otoczeniu. Zastosuj metodę SHOWED.</p>

                        <!-- Placeholder Photo -->
                        <div class="w-full h-64 bg-slate-800 rounded-2xl mb-8 flex flex-col items-center justify-center overflow-hidden relative border border-slate-700">
                            <svg class="w-full h-full opacity-30" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
                                <rect width="400" height="200" fill="#cbd5e1"/>
                                <path d="M50,150 L100,50 L150,150 Z" fill="#94a3b8"/>
                                <path d="M120,150 L180,30 L240,150 Z" fill="#64748b"/>
                                <circle cx="300" cy="50" r="30" fill="#facc15" opacity="0.8"/>
                                <rect x="0" y="150" width="400" height="50" fill="#475569"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-start">
                                <span class="bg-slate-950/70 px-4 py-2 rounded text-slate-200 font-bold backdrop-blur-sm">[Tu wklejono by Twoje zdjęcie]</span>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-purple-300 uppercase mb-1">S - See (Co widzisz?)</label>
                                    <textarea class="w-full p-2 border border-purple-500/30 rounded-lg bg-slate-800/60 text-slate-200 text-sm" rows="2"></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-purple-300 uppercase mb-1">H - Happening (Historia)</label>
                                    <textarea class="w-full p-2 border border-purple-500/30 rounded-lg bg-slate-800/60 text-slate-200 text-sm" rows="2"></textarea>
                                </div>
                            </div>
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-purple-300 uppercase mb-1">O - Our (Nasze życie)</label>
                                    <textarea class="w-full p-2 border border-purple-500/30 rounded-lg bg-slate-800/60 text-slate-200 text-sm" rows="2"></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-purple-300 uppercase mb-1">W - Why (Dlaczego?)</label>
                                    <textarea class="w-full p-2 border border-purple-500/30 rounded-lg bg-slate-800/60 text-slate-200 text-sm" rows="2"></textarea>
                                </div>
                            </div>
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-purple-300 uppercase mb-1">E - Empowerment (Co zrobić?)</label>
                                    <textarea class="w-full p-2 border border-purple-500/30 rounded-lg bg-slate-800/60 text-slate-200 text-sm" rows="2"></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-purple-300 uppercase mb-1">D - Do (Działanie)</label>
                                    <textarea class="w-full p-2 border border-purple-500/30 rounded-lg bg-slate-800/60 text-slate-200 text-sm" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
        ];

        const hoverClassMap = {
            purple: 'bg-purple-500/15 text-purple-400',
            pink: 'bg-pink-500/15 text-pink-400',
            slate: 'bg-slate-700/40 text-slate-300',
            blue: 'bg-blue-500/15 text-blue-400',
            indigo: 'bg-indigo-500/15 text-indigo-400',
            teal: 'bg-teal-500/15 text-teal-400'
        };

        function getHoverColorClass(color) {
            return hoverClassMap[color] || 'bg-slate-700/40 text-slate-300';
        }

        let currentTech = null;

        function initLobby() {
            const list = document.getElementById('tech-list');
            list.innerHTML = '';
            techniques.forEach(tech => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `group p-6 bg-slate-900 border border-slate-800 rounded-2xl hover:border-${tech.color}-500/50 hover:shadow-[0_10px_28px_-14px_rgba(0,0,0,0.6)] transition-all text-left flex items-center gap-6 w-full`;
                btn.onclick = () => loadTech(tech);

                const hoverColorClass = getHoverColorClass(tech.color);

                btn.innerHTML = `
                    <div class="text-4xl w-20 h-20 flex items-center justify-center rounded-2xl transition-colors ${hoverColorClass}">${tech.icon}</div>
                    <div>
                        <div class="font-bold text-slate-100 text-xl mb-1">${tech.title}</div>
                        <div class="text-sm text-slate-500 font-medium">${tech.subtitle}</div>
                        <div class="mt-2 text-xs font-bold uppercase tracking-wider text-slate-600 group-hover:text-${tech.color}-400 transition-colors">Rozpocznij →</div>
                    </div>
                `;
                list.appendChild(btn);
            });
        }

        function loadTech(tech) {
            currentTech = tech;
            document.getElementById('header-title').innerHTML = `<span class="block text-xs text-slate-500 uppercase tracking-wider">${tech.subtitle}</span>${tech.title}`;
            document.getElementById('header-icon').innerText = tech.icon;

            document.getElementById('content-theory').innerHTML = tech.theory;
            document.getElementById('content-method').innerHTML = tech.method;
            document.getElementById('content-result').innerHTML = tech.result;

            document.getElementById('lobby-screen').classList.add('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.remove('opacity-0', 'pointer-events-none');
            app.classList.add('opacity-100');

            setStep(1);

            if (history.replaceState) {
                history.replaceState(null, '', `${location.pathname}#tech=${tech.id}`);
            }
        }

        function showLobby() {
            document.getElementById('lobby-screen').classList.remove('-translate-y-full');
            const app = document.getElementById('app-screen');
            app.classList.add('opacity-0', 'pointer-events-none');

            if (history.replaceState) {
                history.replaceState(null, '', location.pathname);
            }
        }

        function setStep(stepId) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepId}`).classList.add('active');

            const btnDefault = "flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-semibold transition-all text-slate-500 hover:bg-slate-700/40";
            const btnActive = `flex-1 sm:flex-none px-6 py-2 rounded-lg text-sm font-semibold transition-all shadow-sm bg-slate-950 text-${currentTech ? currentTech.color : 'purple'}-400 border border-slate-700/60`;

            for(let i=1; i<=3; i++) {
                const btn = document.getElementById(`tab-${i}`);
                btn.className = (i === stepId) ? btnActive : btnDefault;
            }
        }

        function openFromHash() {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const techId = params.get('tech');
            if (!techId) return;
            const tech = techniques.find(item => item.id === techId);
            if (tech) {
                loadTech(tech);
            }
        }

        initLobby();
        openFromHash();
    </script>
</body>
</html>
